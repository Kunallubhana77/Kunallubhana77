name: Generate Pacman

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
    - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Generate Pacman
        uses: abozanona/pacman-contribution-graph@v1
        with:
          github_user_name: ${{ github.repository_owner }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Organize Files
        run: |
          mkdir -p pacman-contrib
          if [ -f "pacman-contribution-graph.svg" ]; then
            mv pacman-contribution-graph.svg pacman-contrib/
          fi
          ls -R pacman-contrib/

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pacman-contrib/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Pacman contribution graph"
            git push origin HEAD:main
          fi
